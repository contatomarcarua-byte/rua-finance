<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUA FINANCE — Controle Empresarial</title>
<meta name="description" content="RUA FINANCE: sua vida financeira. No seu controle. Lançamentos por voz, fluxo de caixa, margem e ponto de equilíbrio.">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RUA FINANCE">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f4f4f6; --surface: #ffffff; --surface2: #ececf0; --line: #dcdce2;
  --text: #0a0a0a; --muted: #5b5f6b;
  --pos: #087a3a; --neg: #c62828; --gold: #5B21B6;
  --accent: #8B5CF6; --accent-ink: #ffffff; --focus: #5B21B6; --link: #5B21B6;
  --brand-p: #8B5CF6; --brand-p-d: #5B21B6; --brand-p-s: #A78BFA;
  --s-sobra: #12b256; --s-imp: #e5484d; --s-var: #f28c28; --s-fix: #9CA3AF; --s-pl: #A78BFA;
  --disp: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #141414; --surface2: #1A1A1A; --line: #2a2a2e;
    --text: #FFFFFF; --muted: #9CA3AF;
    --pos: #2fd67b; --neg: #ff6b6b; --gold: #A78BFA; --focus: #A78BFA; --link: #A78BFA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #141414; --surface2: #1A1A1A; --line: #2a2a2e;
  --text: #FFFFFF; --muted: #9CA3AF;
  --pos: #2fd67b; --neg: #ff6b6b; --gold: #A78BFA; --focus: #A78BFA; --link: #A78BFA;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.4; min-height: 100%; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- topo e navegação (sempre escuros: identidade da marca) ---------- */
.topo { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: #000; color: #fff; }
.topo-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px 16px 9px; }
.topo img { height: 26px; width: auto; display: block; }
.topo .nome-old { font-family: var(--disp); font-weight: 700; font-size: 17px; letter-spacing: .02em; color: var(--brand-p); line-height: 1; }
.stripe { display: flex; gap: 7px; height: 5px; overflow: hidden; padding-left: 8px; }
.stripe i { display: block; height: 100%; transform: skewX(-35deg); }
.stripe i:nth-child(1) { flex: 1; background: var(--brand-p); }
.stripe i:nth-child(2) { width: 46px; background: var(--brand-p-d); }
.stripe i:nth-child(3) { width: 28px; background: var(--brand-p-s); margin-right: 12px; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #000; border-top: 1px solid #26262b; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr 1.15fr 1fr 1fr; align-items: end; padding: 6px 6px 8px; }
.nav button { background: none; border: 0; color: #9CA3AF; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; font-size: 12px; font-weight: 600; border-radius: 10px; }
.nav button[aria-current="page"] { color: #fff; }
.nav button[aria-current="page"] svg { color: var(--brand-p); }
.nav .fab { position: relative; top: -14px; min-height: 0; padding: 0; gap: 4px; color: #fff; }
.nav .fab span.b { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 18px; background: var(--brand-p); color: #ffffff; box-shadow: 0 0 0 4px #000, 0 0 0 5px var(--brand-p-s); }
.nav .fab span.b svg { width: 28px; height: 28px; stroke-width: 2.6; }
.nav .fab[aria-current="page"] span.b { background: var(--brand-p-d); }
.nav .fab[aria-current="page"] svg { color: #ffffff; }

main { max-width: 560px; margin: 0 auto; padding: 14px 16px calc(112px + env(safe-area-inset-bottom, 0px)); }
h1.tit { font-family: var(--disp); font-weight: 800; font-size: 25px; line-height: 1.1; margin: 6px 0 14px; letter-spacing: -.01em; }
h2 { font-family: var(--disp); font-weight: 700; font-size: 17px; line-height: 1.2; margin: 22px 0 10px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
small, .sm { font-size: 14px; color: var(--muted); }
.pos { color: var(--pos); } .neg { color: var(--neg); } .gold { color: var(--gold); } .mut { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.titrow { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.titrow h1 { margin: 0; flex: 1; }
.back { background: var(--surface2); border: 0; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }

/* mês */
.mes { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mes button { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface2); display: grid; place-items: center; }
.mes span { font-family: var(--disp); font-weight: 700; font-size: 17px; }
.hero .mes button { background: #1A1A1A; color: #fff; }
.hero .mes span { color: #fff; }

/* ---------- herói do painel ---------- */
.hero { background: #000; color: #fff; border-radius: 18px; padding: 14px 16px 18px; margin-top: 4px; border: 1px solid #26262b; --pos: #2fd67b; --neg: #ff6b6b; --gold: #A78BFA; --muted: #9CA3AF; --line: #2a2a2e; }
.hero .lbl { margin-top: 14px; font-size: 15px; color: #C4C7CF; font-weight: 600; }
.hero .big { font-family: var(--disp); font-weight: 800; font-size: 44px; line-height: 1; margin: 2px 0 8px; letter-spacing: -.005em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.hero .sub { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 15px; color: #C4C7CF; }
.hero .sub b { color: #fff; font-weight: 700; }
.hero .aviso { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--brand-p); background: #17131f; font-size: 14px; color: #e6e0f7; border-radius: 0 10px 10px 0; }

.meta { margin-top: 12px; }
.meta-l { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 5px; gap: 8px; }
.meta-l b { color: inherit; }
.bar { height: 10px; background: var(--surface2); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.hero .bar { background: #26262b; }

.cta { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 14px 0 4px; }
.cta .btn { padding: 0 14px; }

/* ---------- botões ---------- */
.btn { min-height: 50px; padding: 0 18px; border-radius: 13px; border: 0; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.sec { background: var(--surface2); color: var(--text); }
.btn.danger { background: transparent; border: 2px solid var(--neg); color: var(--neg); }
.btn.blk { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 15px; }
.btn:disabled { opacity: .5; }
.btns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 16px; }
.btns .btn { padding: 0 12px; min-width: 0; }
.btns.um { grid-template-columns: minmax(0, 1fr); }
.linkbtn { background: none; border: 0; color: var(--link); font-weight: 700; padding: 8px 0; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- estatísticas ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 12px; }
.stat { --tone: var(--text); position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 14px 13px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat::before { content: ''; position: absolute; left: 14px; top: -1px; width: 36px; height: 5px; background: var(--tone); transform: skewX(-35deg); border-radius: 0 0 2px 2px; }
.stat.pos { --tone: var(--pos); } .stat.neg { --tone: var(--neg); } .stat.gold { --tone: var(--gold); } .stat.mut { --tone: var(--muted); }
.stat.g2 { grid-column: 1 / -1; }
.stat .k { font-size: 14px; color: var(--muted); font-weight: 600; }
.fit { white-space: nowrap; overflow: hidden; }
.stat .v { font-family: var(--disp); font-weight: 700; font-size: 23px; line-height: 1.1; color: var(--tone); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 13px; color: var(--muted); }
.stat.gold .v { color: var(--gold); }
.stat .meta { margin-top: 8px; }

/* ---------- listas ---------- */
.lista { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 14px; min-height: 60px; }
.row:last-child { border-bottom: 0; }
.row .dot { width: 10px; height: 26px; transform: skewX(-18deg); border-radius: 2px; flex: none; background: var(--muted); }
.row .dot.entrada { background: #12b256; } .row .dot.saida_pj { background: #ff6b6b; } .row .dot.saida_pf { background: #9CA3AF; } .row .dot.prolabore { background: var(--brand-p-s); }
.row .rm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .rm b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rm small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rv { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .chev { color: var(--muted); }
.diahead { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; color: var(--muted); padding: 14px 4px 6px; }
.vazio { text-align: center; padding: 28px 16px; color: var(--muted); }
.vazio b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }

/* ---------- formulário ---------- */
label.f { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
.inp { width: 100%; min-height: 50px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 14px; font-size: 17px; font-weight: 500; }
select.inp { padding-right: 8px; }
textarea.inp { padding: 12px 14px; min-height: 120px; font-size: 15px; font-family: ui-monospace, Menlo, monospace; }
.inp.valor { font-family: var(--disp); font-weight: 800; font-size: 30px; min-height: 66px; padding-left: 58px; }
.valorwrap { position: relative; }
.valorwrap::before { content: 'R$'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-family: var(--disp); font-weight: 700; font-size: 17px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg.tres { grid-template-columns: repeat(3, 1fr); }
.seg button { min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; padding: 0 8px; }
.seg button[aria-pressed="true"] { border-color: transparent; color: #ffffff; }
.seg button[data-v="entrada"][aria-pressed="true"] { background: #12b256; }
.seg button[data-v="saida_pj"][aria-pressed="true"] { background: #ff6b6b; }
.seg button[data-v="saida_pf"][aria-pressed="true"] { background: #9CA3AF; }
.seg button[data-v="prolabore"][aria-pressed="true"] { background: #A78BFA; }
.seg.neutro button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.erro { color: var(--neg); font-weight: 600; font-size: 14px; margin-top: 8px; min-height: 0; }
.dica { font-size: 13px; color: var(--muted); margin-top: 5px; }

/* voz */
.voz { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0 14px; }
.mic { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--brand-p); color: #ffffff; display: grid; place-items: center; box-shadow: 0 0 0 5px var(--bg), 0 0 0 7px var(--brand-p-s); }
.mic svg { width: 58px; height: 58px; stroke-width: 2.2; }
.mic[aria-pressed="true"] { background: #ff5a5a; }
.mic[aria-pressed="true"]::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid #ff5a5a; animation: pulso 1.3s ease-out infinite; }
@keyframes pulso { from { transform: scale(.94); opacity: .9; } to { transform: scale(1.25); opacity: 0; } }
.voztxt { text-align: center; min-height: 44px; font-size: 16px; color: var(--muted); max-width: 32ch; }
.voztxt.live { color: var(--text); font-weight: 600; }
.voztxt.ok { color: var(--pos); font-weight: 600; }
.voztxt.err { color: var(--neg); font-weight: 600; }
.frase { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

/* ---------- blocos de resumo ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px; margin: 0 -16px; padding-left: 16px; padding-right: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 42px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.datas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin: 12px 0; }
.duo > * { min-width: 0; }
@media (min-width: 540px) { .duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.bloco { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.bloco h3 { margin: 0 0 8px; font-family: var(--disp); font-size: 15px; font-weight: 700; }
.bloco .li { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; }
.bloco .li span:first-child { color: var(--muted); }
.bloco .li b { font-variant-numeric: tabular-nums; }
.bloco .saldo { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
.bloco .saldo .li span:first-child { color: var(--text); font-weight: 700; }
.bloco .saldo .li b { font-family: var(--disp); font-size: 16px; }
.bloco.full { grid-column: 1 / -1; }

/* indicadores */
.ind { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 10px; }
.ind-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ind-h > span { font-weight: 700; }
.ind-h > b { white-space: nowrap; overflow: hidden; min-width: 0; font-family: var(--disp); font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ind p { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.ind .bar { margin-top: 10px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.pair .ind { margin-top: 10px; }
.pair .ind-h { flex-direction: column; align-items: stretch; gap: 2px; }
.stack { display: flex; height: 26px; border-radius: 8px; overflow: hidden; gap: 2px; background: var(--surface2); margin: 10px 0 12px; }
.stack i { display: block; height: 100%; min-width: 2px; }
.leg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 14px; }
.leg div { display: flex; align-items: center; gap: 8px; }
.leg i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.leg b { margin-left: auto; font-variant-numeric: tabular-nums; }
.topg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; }
.topg:last-child { border-bottom: 0; }
.topg .bar { grid-column: 1 / -1; height: 6px; }
.topg .bar > i { background: var(--neg); }

/* menu e tabelas */
.menu { display: flex; flex-direction: column; gap: 10px; }
.menu button { display: flex; align-items: center; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 68px; width: 100%; }
.menu .ic { width: 44px; height: 44px; display: grid; place-items: center; background: #000; color: var(--brand-p-s); border-radius: 12px; flex: none; }

.menu .tx { flex: 1; display: flex; flex-direction: column; }
.menu .tx b { font-size: 17px; }
.tab { width: 100%; border-collapse: collapse; font-size: 15px; }
.tab td { padding: 9px 0; border-bottom: 1px dashed var(--line); }
.tab td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tab tr.tot td { border-bottom: 2px solid var(--text); font-weight: 800; }
.tab tr:last-child td { border-bottom: 0; }
.tab .ind2 td:first-child { padding-left: 14px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 10px; }
.card h3 { margin: 0 0 8px; font-size: 16px; }
.grafico { width: 100%; height: auto; display: block; }
.grafico text { font-family: 'Barlow', system-ui, sans-serif; font-size: 11px; fill: var(--muted); }
.legh { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.legh i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
.status { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.status.pago { background: color-mix(in srgb, var(--pos) 18%, transparent); color: var(--pos); }
.status.pendente { background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); }
.sugestoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.sw .tx { flex: 1; }
.sw .tx b { display: block; }
.logofull { display: block; width: 100%; max-width: 280px; margin: 18px auto 6px; border-radius: 12px; }
.ajuda { font-size: 14px; color: var(--muted); }
.ajuda li { margin-bottom: 4px; }

/* ---------- gaveta e aviso ---------- */
.gaveta { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.gaveta .fundo { position: absolute; inset: 0; background: rgba(0,0,0,.62); }
.gaveta .painel { position: relative; width: 100%; max-width: 560px; max-height: 90%; overflow: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom, 0px)); animation: sobe .18s ease-out; }
@keyframes sobe { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.painel h2 { margin-top: 0; }
.painel .gv { font-family: var(--disp); font-weight: 800; font-size: 30px; line-height: 1.1; margin: 6px 0 4px; }
.aviso-t { border-left: 3px solid var(--brand-p); position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: #141414; color: #fff; border: 1px solid #33333a; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 14px; max-width: min(92vw, 520px); box-shadow: 0 8px 28px rgba(0,0,0,.35); font-weight: 600; font-size: 15px; }
.aviso-t button { background: none; border: 0; color: var(--brand-p-s); font-weight: 800; padding: 6px 4px; min-height: 36px; }

@media (max-width: 370px) {
}
@media (prefers-reduced-motion: reduce) {
  .mic[aria-pressed="true"]::after { animation: none; }
  .gaveta .painel { animation: none; }
}
@media print {
  .topo, .nav, .no-print, .back { display: none !important; }
  body { background: #fff; color: #000; }
  main { padding: 0; max-width: none; }
  .card, .bloco, .ind { border-color: #bbb; break-inside: avoid; }
  :root { --surface: #fff; --text: #000; --muted: #444; --pos: #087a3a; --neg: #c62828; --line: #ccc; }
}


/* ---------- identidade RUA FINANCE ---------- */
.nav .fab { gap: 9px; }
.topo-in { gap: 10px; padding: 10px 16px 9px; }
.topo img.r { height: 30px; width: auto; display: block; }
.topo .nome { font-family: var(--disp); font-weight: 800; font-size: 17px; letter-spacing: .01em; color: #fff; line-height: 1; padding-left: 10px; border-left: 1px solid #33333a; }
.topo .nome span { color: var(--brand-p); }
.topo .nome b { font-weight: 800; }
.stripe { gap: 6px; height: 3px; }
.stripe i:nth-child(1) { background: var(--brand-p); }
.stripe i:nth-child(2) { width: 40px; background: var(--brand-p-d); }
.stripe i:nth-child(3) { width: 22px; background: var(--brand-p-s); }
.btn.pri, .mic { color: #fff; }
.btn.pri:active { background: var(--brand-p-d); }
.chip[aria-pressed="true"] { background: var(--brand-p); border-color: var(--brand-p); color: #fff; }
.seg.neutro button[aria-pressed="true"] { background: var(--brand-p); color: #fff; }
.seg button[data-v="prolabore"][aria-pressed="true"] { background: var(--brand-p-s); color: #000; }
.nav button[aria-current="page"] svg { color: var(--brand-p-s); }
.nav button { font-size: 11px; font-weight: 600; letter-spacing: .01em; }
.hero .mes span, .hero .lbl { letter-spacing: 0; }
.hero { border-color: #2a2a2e; }
.hero::before { content: ''; display: block; height: 2px; width: 44px; background: var(--brand-p); border-radius: 2px; margin-bottom: 12px; }
.lockup { display: flex; align-items: center; gap: 14px; background: #000; border: 1px solid #2a2a2e; border-radius: 16px; padding: 16px; margin-top: 18px; color: #fff; }
.lockup img { height: 44px; width: auto; display: block; }
.lockup div { display: flex; flex-direction: column; gap: 4px; padding-left: 14px; border-left: 1px solid #33333a; }
.lockup b { font-weight: 800; font-size: 20px; letter-spacing: .01em; line-height: 1; }
.lockup b span { color: var(--brand-p); }
.lockup small { font-size: 10px; letter-spacing: .12em; color: #9CA3AF; font-weight: 600; }
#splash { position: fixed; inset: 0; z-index: 100; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .4s ease; padding: 24px; text-align: center; }
#splash.saindo { opacity: 0; pointer-events: none; }
#splash img { width: 112px; height: auto; }
#splash .sp-n { font-weight: 800; font-size: 28px; letter-spacing: .02em; line-height: 1; }
#splash .sp-n span { color: var(--brand-p); }
#splash .sp-s { font-size: 11px; letter-spacing: .16em; color: #9CA3AF; font-weight: 600; max-width: 28ch; line-height: 1.6; }
#splash .sp-b { display: block; position: relative; width: 120px; height: 3px; background: #26262b; border-radius: 3px; overflow: hidden; margin-top: 14px; }
#splash .sp-b::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; background: var(--brand-p); border-radius: 3px; animation: carrega 1s ease-in-out infinite; }
@keyframes carrega { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
@media (prefers-reduced-motion: reduce) { #splash .sp-b::after { animation: none; width: 100%; } #splash { transition: none; } }
@media print { #splash { display: none !important; } }

/* ---------- v2: núcleo financeiro, diagnóstico e agenda ---------- */
.perfis { display: flex; gap: 6px; }
.perfis button { flex: 1; min-height: 38px; border-radius: 999px; border: 1px solid #2a2a2e; background: transparent; color: #9CA3AF; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.perfis button[aria-pressed="true"] { background: var(--brand-p); border-color: var(--brand-p); color: #fff; }
.perfis.claro { margin: 0 0 6px; }
.perfis.claro button { border-color: var(--line); background: var(--surface); color: var(--muted); }
.perfis.claro button[aria-pressed="true"] { background: var(--brand-p); border-color: var(--brand-p); color: #fff; }
.hero .perfis { margin: 2px 0 4px; }
.hero .tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #26262b; }
.hero .tri small { display: block; font-size: 11px; color: #9CA3AF; font-weight: 600; margin-bottom: 2px; }
.hero .tri b { display: block; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero .situ { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid #26262b; font-size: 14px; color: #9CA3AF; font-weight: 600; }
.nv { display: inline-block; padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 800; letter-spacing: .02em; color: #000; vertical-align: middle; }
.nv-saudavel { background: #12b256; } .nv-atencao { background: #f5c542; } .nv-risco { background: #f28c28; } .nv-critica { background: #ff6b6b; } .nv-indefinida { background: #9CA3AF; }
button.stat { text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
button.stat .v { color: var(--tone); }
.stat .v .nv { font-size: 14px; padding: 5px 13px; }
.prox { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--brand-p); border-radius: 14px; padding: 14px; }
.prox > b { font-size: 17px; display: block; margin-bottom: 4px; }
.prox p { margin: 0 0 10px; }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--link); padding: 4px 0; }
details p, details ul { font-size: 14px; color: var(--muted); }
.prox details { margin-bottom: 12px; }
.qa { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.qa button { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; min-height: 76px; padding: 12px 2px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; font-size: 11px; font-weight: 600; text-align: center; line-height: 1.2; }
.qa svg { color: var(--brand-p); width: 24px; height: 24px; }
.alerta { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--brand-p); border-radius: 14px; margin-bottom: 8px; }
.alerta.al-risco { border-left-color: #ff6b6b; } .alerta.al-atencao { border-left-color: #f5c542; }
.alerta summary { display: flex; gap: 10px; align-items: center; padding: 12px 14px; font-size: 15px; color: var(--text); list-style: none; }
.alerta summary::-webkit-details-marker { display: none; }
.alerta p, .alerta ul { margin: 0; padding: 0 14px 10px; }
.alerta ul { padding-left: 32px; }
.ai { display: grid; place-items: center; flex: none; }
.ai-risco { color: var(--neg); } .ai-atencao { color: #d99a00; } .ai-info { color: var(--link); }
.exemplo { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface2); border: 1px dashed var(--brand-p); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px; }
.exemplo b { display: block; font-size: 14px; } .exemplo small { font-size: 12px; }
.crit td { vertical-align: top; } .crit td small { color: var(--muted); font-size: 12px; }
.crit td:last-child { text-align: right; font-weight: 600; white-space: normal; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.kv:last-of-type { border-bottom: 0; } .kv span { color: var(--muted); } .kv b { text-align: right; font-variant-numeric: tabular-nums; }
.fat { list-style: none; padding: 0; margin: 8px 0 0; font-size: 14px; }
.fat li { position: relative; padding: 6px 0 6px 26px; }
.fat li::before { position: absolute; left: 2px; top: 6px; font-weight: 800; }
.fat li.ok::before { content: '✓'; color: var(--pos); } .fat li.pa::before { content: '◐'; color: #d99a00; } .fat li.no::before { content: '○'; color: var(--muted); }
.row .lnk { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.row .lnk b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .lnk small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .dot.transf { background: var(--brand-p-s); }
.ic2 { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; background: var(--surface2); color: var(--brand-p); flex: none; }
.chk { display: flex; gap: 12px; align-items: flex-start; margin-top: 16px; font-weight: 600; }
.chk input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--brand-p); flex: none; }
.chk small { display: block; font-weight: 400; margin-top: 2px; }
.efeito { background: var(--surface2); border-left: 3px solid var(--brand-p); border-radius: 0 10px 10px 0; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
.seg button:disabled { opacity: .45; }
.card .ind-h { margin-bottom: 2px; }
.seg button[data-v="entrada"][aria-pressed="true"], .seg button[data-v="saida_pj"][aria-pressed="true"], .seg button[data-v="saida_pf"][aria-pressed="true"], .seg button[data-v="prolabore"][aria-pressed="true"] { color: #000; }
.seg button[data-v="transf"][aria-pressed="true"] { background: var(--brand-p); border-color: transparent; color: #fff; }
.row .lnk b, .row .lnk small { white-space: normal; overflow: visible; text-overflow: clip; }
.row .lnk small { line-height: 1.3; }
.row .btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; flex: none; }
.row:has(.lnk) .rv { font-size: 15px; }
.row:has(.lnk) { padding-left: 12px; padding-right: 12px; gap: 10px; align-items: flex-start; }
.row:has(.lnk) .btn.sm { align-self: center; }
.row:has(.lnk) .rv { align-self: center; }
</style>
</head>

/* ---------- utilitários ---------- */
function norm(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pad(n) { return String(n).padStart(2, '0'); }
function isoDe(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function hojeISO() { return isoDe(new Date()); }
function mesAtual() { return hojeISO().slice(0, 7); }
function somaMes(ym, n) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function addDias(iso, n) { const [y, m, d] = iso.split('-').map(Number); return isoDe(new Date(y, m - 1, d + n)); }
function nomeMes(ym) { const [y, m] = ym.split('-').map(Number); return MESES[m - 1] + ' ' + y; }
function nomeMesCurto(ym) { const m = Number(ym.split('-')[1]); return MESES_CURTOS[m - 1]; }
function fmtData(iso) { const p = iso.split('-'); return p[2] + '/' + p[1]; }
function rotuloDia(iso) { const [y, m, d] = iso.split('-').map(Number); return DIAS_SEM[new Date(y, m - 1, d).getDay()] + ', ' + pad(d) + ' ' + MESES_CURTOS[m - 1]; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function r2(v) { return Math.round((v + Number.EPSILON) * 100) / 100; }

const _brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
function brl(v) { v = r2(v || 0); if (Object.is(v, -0)) v = 0; return _brl.format(v); }
function pct(v, dec) { return isFinite(v) ? (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: dec == null ? 1 : dec }) + '%' : '—'; }
function pctDe(a, b, dec) { return b > 0 ? pct(a / b, dec) : '—'; }
function sinal(v) { return v > 0.004 ? 'pos' : v < -0.004 ? 'neg' : 'mut'; }

function parseBR(s) {
  s = String(s == null ? '' : s).trim().replace(/[R$\s]/gi, '');
  if (!s) return NaN;
  if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) return parseFloat(s.replace(/\./g, '').replace(',', '.'));
  if (/^\d+([.,]\d+)?$/.test(s)) return parseFloat(s.replace(',', '.'));
  return NaN;
}
function numParaInput(v) { return String(r2(v)).replace('.', ','); }

/* ---------- interpretação de frases (voz ou texto) ---------- */
const NUM_U = new Map(Object.entries({ zero: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5, seis: 6, sete: 7, oito: 8, nove: 9, dez: 10, onze: 11, doze: 12, treze: 13, catorze: 14, quatorze: 14, quinze: 15, dezesseis: 16, dezessete: 17, dezoito: 18, dezenove: 19 }));
const NUM_D = new Map(Object.entries({ vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90 }));
const NUM_C = new Map(Object.entries({ cem: 100, cento: 100, duzentos: 200, trezentos: 300, quatrocentos: 400, quinhentos: 500, seiscentos: 600, setecentos: 700, oitocentos: 800, novecentos: 900 }));
const ehNumPalavra = w => NUM_U.has(w) || NUM_D.has(w) || NUM_C.has(w);
const valNumPalavra = w => NUM_U.has(w) ? NUM_U.get(w) : NUM_D.has(w) ? NUM_D.get(w) : NUM_C.get(w);

function lerNumeroPalavras(tk, i) {
  let total = 0, atual = 0, usou = false, j = i;
  while (j < tk.length) {
    const w = tk[j];
    if (ehNumPalavra(w)) { atual += valNumPalavra(w); usou = true; j++; }
    else if (w === 'mil') { total += (atual || 1) * 1000; atual = 0; usou = true; j++; }
    else if (w === 'e' && usou && j + 1 < tk.length && ehNumPalavra(tk[j + 1])) { j++; }
    else break;
  }
  return usou ? { val: total + atual, next: j } : null;
}

function acharValor(t) {
  t = t.replace(/r\$\s*/g, ' rs ');
  const tk = t.replace(/[^a-z0-9.,\s]/g, ' ').split(/\s+/).filter(Boolean).map(w => w.replace(/[.,]+$/, '')).filter(Boolean);
  const MOEDA = /^(reais|real|pila|pilas|conto|contos)$/;
  const cands = [];
  for (let i = 0; i < tk.length; i++) {
    let val = null, fim = i;
    const ehDigito = /^\d[\d.,]*$/.test(tk[i]);
    if (ehDigito) {
      val = parseBR(tk[i]); fim = i + 1;
      if (isNaN(val)) continue;
      if (tk[fim] === 'mil') {
        val *= 1000; fim++;
        if (tk[fim] === 'e' && /^\d{1,3}$/.test(tk[fim + 1] || '') && !/^centavos?$/.test(tk[fim + 2] || '')) { val += Number(tk[fim + 1]); fim += 2; }
      }
    } else {
      const r = lerNumeroPalavras(tk, i);
      if (r) { val = r.val; fim = r.next; }
    }
    if (val == null) continue;
    const marca = tk[i - 1] === 'rs' || MOEDA.test(tk[fim] || '');
    let j = fim;
    if (/^(reais|real)$/.test(tk[j] || '')) j++;
    if (tk[j] === 'e') {
      let c = null, k = j + 1;
      if (/^\d{1,2}$/.test(tk[k] || '')) { c = Number(tk[k]); k++; }
      else { const r2_ = lerNumeroPalavras(tk, k); if (r2_) { c = r2_.val; k = r2_.next; } }
      if (c != null && /^centavos?$/.test(tk[k] || '')) { val += c / 100; fim = k + 1; }
    }
    if (!marca && val <= 2 && !ehDigito) { i = fim - 1; continue; }
    cands.push({ val, marca, pos: i });
    i = fim - 1;
  }
  if (!cands.length) return null;
  cands.sort((a, b) => (Number(b.marca) - Number(a.marca)) || (b.val - a.val));
  return r2(cands[0].val);
}

function extrairData(t, hoje) {
  hoje = hoje || hojeISO();
  let m;
  if ((m = t.match(/\banteontem\b/))) return { data: addDias(hoje, -2), resto: t.replace(m[0], ' ') };
  if ((m = t.match(/\bontem\b/))) return { data: addDias(hoje, -1), resto: t.replace(m[0], ' ') };
  const valida = (a, mes, d) => { const dt = new Date(a, mes - 1, d); return dt.getFullYear() === a && dt.getMonth() === mes - 1 && dt.getDate() === d; };
  if ((m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))) {
    const d = +m[1], mes = +m[2]; let a = m[3] ? +m[3] : +hoje.slice(0, 4); if (a < 100) a += 2000;
    if (valida(a, mes, d)) return { data: a + '-' + pad(mes) + '-' + pad(d), resto: t.replace(m[0], ' ') };
  }
  const nomes = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  if ((m = t.match(/\bdia (\d{1,2})(?: de (janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro))?/))) {
    const d = +m[1]; const a = +hoje.slice(0, 4); const mes = m[2] ? nomes.indexOf(m[2]) + 1 : +hoje.slice(5, 7);
    if (valida(a, mes, d)) return { data: a + '-' + pad(mes) + '-' + pad(d), resto: t.replace(m[0], ' ') };
  }
  if ((m = t.match(/\bhoje\b/))) return { data: hoje, resto: t.replace(m[0], ' ') };
  return { data: hoje, resto: t };
}

function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function melhorCat(t, cats, tiposPermitidos) {
  let melhor = null, score = 0;
  for (const c of cats) {
    if (tiposPermitidos && tiposPermitidos.length && !tiposPermitidos.includes(c.tipo)) continue;
    if (tiposPermitidos && !tiposPermitidos.length) continue;
    const kws = (c.palavras || []).map(norm).filter(Boolean);
    const nome = norm(c.nome);
    if (nome.length >= 3) kws.push(nome);
    for (const kw of kws) {
      if (new RegExp('(?:^|[^a-z0-9])' + escRe(kw)).test(t) && kw.length > score) { melhor = c; score = kw.length; }
    }
  }
  return melhor;
}
function catSugerida(texto, tipoLanc, cats) {
  if (!texto || tipoLanc === 'prolabore') return null;
  return melhorCat(norm(texto), cats, CATS_POR_TIPO_LANC[tipoLanc]);
}

function classificar(texto, cats, hoje) {
  const original = String(texto || '').trim();
  let t = norm(original);
  const d = extrairData(t, hoje);
  const valor = acharValor(d.resto);
  t = d.resto;
  let tipo = null, generico = null;
  const RE_PL = /pro-?\s?labore|prolabore|retirada|retirei|retirar/;
  const RE_PF = /\b(pessoal|pf|particular|pra mim|para mim|minha casa|em casa)\b/;
  const RE_E = /\b(recebi|ganhei|faturei|vendi|recebimento|receita)\b/;
  const RE_S = /\b(paguei|gastei|comprei|abasteci|troquei|consertei|pago|despesa|gasto|saida|custou|custo)\b/;
  const RE_EW = /\b(entrada|venda|frete|cliente pagou|entrou)\b/;
  if (RE_PL.test(t)) tipo = 'prolabore';
  else if (RE_PF.test(t)) tipo = 'saida_pf';
  else {
    const se = RE_E.exec(t), ss = RE_S.exec(t);
    if (se && (!ss || se.index < ss.index)) tipo = 'entrada';
    else if (ss) generico = 'saida';
    else if (RE_EW.test(t)) generico = 'entrada';
  }
  let permitidos;
  if (tipo === 'entrada' || generico === 'entrada') permitidos = ['receita'];
  else if (tipo === 'saida_pf') permitidos = ['pf'];
  else if (tipo === 'prolabore') permitidos = [];
  else if (generico === 'saida') permitidos = ['pj_variavel', 'pj_fixo', 'imposto', 'pf'];
  else permitidos = null;
  const cat = melhorCat(t, cats, permitidos);
  if (!tipo) {
    if (cat) tipo = cat.tipo === 'receita' ? 'entrada' : cat.tipo === 'pf' ? 'saida_pf' : 'saida_pj';
    else tipo = generico === 'entrada' ? 'entrada' : 'saida_pj';
  }
  let desc = original.replace(/[.!?]+$/, '');
  desc = desc.charAt(0).toUpperCase() + desc.slice(1);
  return { tipo, valor, cat: cat ? cat.id : '', data: d.data, desc };
}

/* ---------- cálculos ---------- */
function mapaCats(db) { const m = {}; db.cats.forEach(c => { m[c.id] = c; }); return m; }

function statusFixos(db, lsMes, ym) {
  const ls = lsMes.filter(l => l.tipo === 'saida_pj');
  const grupos = {};
  db.fixos.filter(f => (f.criado || '0000-00') <= ym).forEach(f => {
    const k = f.cat || ('f:' + f.id);
    (grupos[k] = grupos[k] || { plan: 0, itens: [] });
    grupos[k].plan += f.valor; grupos[k].itens.push(f);
  });
  let pend = 0; const status = {};
  for (const k in grupos) {
    const g = grupos[k]; const ids = g.itens.map(f => f.id);
    const porCat = k.startsWith('f:') ? 0 : soma(ls.filter(l => l.cat === k), l => l.valor);
    const ligados = soma(ls.filter(l => ids.includes(l.fixoId) && (k.startsWith('f:') || l.cat !== k)), l => l.valor);
    const pago = porCat + ligados;
    const faltando = Math.max(0, g.plan - pago);
    pend += faltando;
    g.itens.forEach(f => { status[f.id] = ls.some(l => l.fixoId === f.id) || pago >= g.plan - 0.005 ? 'pago' : 'pendente'; });
  }
  return { pend: r2(pend), status };
}

function calcular(db, ym) {
  const ls = db.lanc.filter(l => l.data.slice(0, 7) === ym);
  return calcularLista(db, ls, ym);
}

function getMeta(db, ym) {
  if (db.metas[ym]) return { fat: db.metas[ym].fat || 0, sobra: db.metas[ym].sobra || 0, herdada: false };
  const ks = Object.keys(db.metas).filter(k => k < ym).sort();
  if (ks.length) { const m = db.metas[ks[ks.length - 1]]; return { fat: m.fat || 0, sobra: m.sobra || 0, herdada: true }; }
  return { fat: 0, sobra: 0, herdada: false };
}
function calcContador(db, ym) {
  const ids = db.cats.filter(c => norm(c.nome).includes('contador')).map(c => c.id);
  const ls = db.lanc.filter(l => l.data.slice(0, 7) === ym && l.tipo === 'saida_pj' && ids.includes(l.cat));
  const pago = soma(ls, l => l.valor);
  const plan = soma(db.fixos.filter(f => ids.includes(f.cat) && (f.criado || '0000-00') <= ym), f => f.valor);
  return { pago: r2(pago), pend: r2(Math.max(0, plan - pago)) };
}



/* =====================================================================
   RUA FINANCE — motor financeiro (núcleo compartilhado CPF / CNPJ / Híbrido)
   Sem acesso a DOM. Valores somados em centavos inteiros (sem erro de ponto flutuante).
   ===================================================================== */
const NATUREZAS = { prolabore: 'Pró-labore', distribuicao: 'Distribuição de lucros', reembolso: 'Reembolso', emprestimo: 'Empréstimo entre partes relacionadas', outras: 'Outras transferências' };
const NATUREZA_RENDA_PF = ['prolabore', 'distribuicao'];
const CONTA_TIPOS = { corrente: 'Conta corrente', carteira: 'Carteira (dinheiro)', reserva: 'Reserva / poupança' };
const SAUDE_PADRAO = { reservaMesesPF: 6, reservaMesesPJ: 3, compSaudavel: 50, compAtencao: 70, compRisco: 90, margemSaudavel: 10 };
const NIVEIS = ['saudavel', 'atencao', 'risco', 'critica'];
const NIVEL_NOME = { saudavel: 'Saudável', atencao: 'Atenção', risco: 'Risco', critica: 'Crítica', indefinida: 'Indefinida' };

const cent = v => Math.round((Number(v) || 0) * 100);
function soma(arr, f) { let c = 0; for (const x of arr) c += cent(f ? f(x) : x); return c / 100; }
const inEscopo = (per, esc) => esc === 'ambos' || (esc === 'pj' && per === 'PJ') || (esc === 'pf' && per === 'PF');
function diffDias(a, b) { const f = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 864e5); }
function ultimoDiaMes(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function dataNoMes(ym, dia) { return ym + '-' + pad(Math.min(Math.max(1, Number(dia) || 1), ultimoDiaMes(ym))); }

/* ---------- banco de dados e migração ---------- */
function novoDb() {
  const hoje = hojeISO();
  return {
    v: 2, lanc: [], fixos: [], metas: {}, recorr: [], agenda: [], log: [], exemplo: false,
    cats: CATS_PADRAO.map(c => ({ ...c, palavras: [...c.palavras], essencial: !(c.tipo === 'pf' && /lazer/.test(norm(c.nome))) })),
    contas: [
      { id: 'c_pj', nome: 'Conta da empresa', perfil: 'PJ', tipo: 'corrente', saldoIni: 0, ativa: true, criadoEm: hoje },
      { id: 'c_pf', nome: 'Carteira pessoal', perfil: 'PF', tipo: 'carteira', saldoIni: 0, ativa: true, criadoEm: hoje }
    ],
    config: { aliquota: 6, tema: 'auto', voiceAuto: false, ultimoBackup: null, perfil: 'hibrido', prolaborePlanejado: 0, saude: { ...SAUDE_PADRAO } }
  };
}
function migrarDb(d) {
  const p = novoDb();
  d = d || {};
  const velho = !d.v || d.v < 2 || !Array.isArray(d.contas) || !d.contas.length;
  const db = {
    ...p, ...d,
    config: { ...p.config, ...(d.config || {}) },
    lanc: Array.isArray(d.lanc) ? d.lanc.map(x => ({ ...x })) : [],
    cats: Array.isArray(d.cats) && d.cats.length ? d.cats.map(c => ({ ...c })) : p.cats,
    fixos: Array.isArray(d.fixos) ? d.fixos : [],
    metas: d.metas && typeof d.metas === 'object' ? d.metas : {},
    contas: Array.isArray(d.contas) && d.contas.length ? d.contas : p.contas,
    recorr: Array.isArray(d.recorr) ? d.recorr : [],
    agenda: Array.isArray(d.agenda) ? d.agenda : [],
    log: Array.isArray(d.log) ? d.log : []
  };
  db.config.saude = { ...SAUDE_PADRAO, ...(db.config.saude || {}) };
  db.cats.forEach(c => { if (c.essencial === undefined) c.essencial = !(c.tipo === 'pf' && /lazer/.test(norm(c.nome))); });
  if (velho) {
    const hoje = hojeISO();
    db.contas = [
      { id: 'c_pj', nome: 'Conta da empresa', perfil: 'PJ', tipo: 'corrente', saldoIni: r2(Number(db.config.saldoIniPJ) || 0), ativa: true, criadoEm: hoje },
      { id: 'c_pf', nome: 'Carteira pessoal', perfil: 'PF', tipo: 'carteira', saldoIni: r2(Number(db.config.saldoIniPF) || 0), ativa: true, criadoEm: hoje }
    ];
    db.lanc = db.lanc.map(l => {
      if (l.tipo === 'prolabore') return { ...l, tipo: 'transf', natureza: 'prolabore', conta: 'c_pj', contaDest: 'c_pf' };
      if (l.tipo === 'saida_pf') return { ...l, conta: 'c_pf' };
      return { ...l, conta: 'c_pj' };
    });
    db.log.push({ ts: Date.now(), acao: 'Migração', detalhe: 'Dados convertidos para o modelo com contas (v2). ' + db.lanc.length + ' lançamentos preservados.' });
  }
  db.v = 2;
  return db;
}

/* ---------- contas ---------- */
function contaPorId(db, id) { return db.contas.find(c => c.id === id) || null; }
function contasDo(db, perfil) { return db.contas.filter(c => c.ativa !== false && (!perfil || c.perfil === perfil)); }
function contaPadrao(db, perfil) { const cs = contasDo(db, perfil); return cs.find(c => c.tipo !== 'reserva') || cs[0] || null; }
function contaDoLanc(db, l) {
  if (l.conta && contaPorId(db, l.conta)) return l.conta;
  const c = contaPadrao(db, l.tipo === 'saida_pf' ? 'PF' : 'PJ') || db.contas[0];
  return c ? c.id : null;
}
function perfilLanc(db, l) { const c = contaPorId(db, contaDoLanc(db, l)); return c ? c.perfil : (l.tipo === 'saida_pf' ? 'PF' : 'PJ'); }
function perfilDest(db, l) { const c = contaPorId(db, l.contaDest); return c ? c.perfil : null; }
function sentidoTransf(db, l) { const o = perfilLanc(db, l), d = perfilDest(db, l); return o === d ? 'interna' : (o === 'PJ' ? 'pj_pf' : 'pf_pj'); }

function saldoConta(db, id, ate) {
  const c = contaPorId(db, id); if (!c) return 0;
  let s = cent(c.saldoIni);
  for (const l of db.lanc) {
    if (ate && l.data > ate) continue;
    const v = cent(l.valor);
    if (l.tipo === 'transf') { if (contaDoLanc(db, l) === id) s -= v; if (l.contaDest === id) s += v; }
    else if (contaDoLanc(db, l) === id) s += l.tipo === 'entrada' ? v : -v;
  }
  return s / 100;
}
function saldos(db, ate) {
  const r = { pj: 0, pf: 0, pjLivre: 0, pfLivre: 0, reservaPJ: 0, reservaPF: 0, porConta: {} };
  for (const c of db.contas) {
    const s = cent(saldoConta(db, c.id, ate)); r.porConta[c.id] = s / 100;
    const k = c.perfil === 'PJ' ? 'pj' : 'pf';
    r[k] += s;
    if (c.tipo === 'reserva') r[k === 'pj' ? 'reservaPJ' : 'reservaPF'] += s; else r[k + 'Livre'] += s;
  }
  ['pj', 'pf', 'pjLivre', 'pfLivre', 'reservaPJ', 'reservaPF'].forEach(k => { r[k] = r[k] / 100; });
  r.total = r2(r.pj + r.pf);
  return r;
}
function saldoEscopo(db, esc, ate) {
  const s = saldos(db, ate);
  return esc === 'pj' ? { livre: s.pjLivre, reserva: s.reservaPJ, total: s.pj } : esc === 'pf' ? { livre: s.pfLivre, reserva: s.reservaPF, total: s.pf } : { livre: r2(s.pjLivre + s.pfLivre), reserva: r2(s.reservaPJ + s.reservaPF), total: s.total };
}

/* ---------- validação e criação de lançamentos (inclui a ponte CPF↔CNPJ) ---------- */
function validarLanc(db, l) {
  if (!(cent(l.valor) > 0)) return 'Informe um valor maior que zero.';
  if (!/^\d{4}-\d{2}-\d{2}$/.test(l.data || '')) return 'Escolha a data do lançamento.';
  if (l.tipo === 'transf') {
    if (!l.conta || !l.contaDest || !contaPorId(db, l.conta) || !contaPorId(db, l.contaDest)) return 'Escolha a conta de origem e a de destino.';
    if (l.conta === l.contaDest) return 'Origem e destino precisam ser contas diferentes.';
    if (perfilLanc(db, l) !== perfilDest(db, l) && !NATUREZAS[l.natureza]) return 'Classifique a natureza da transferência.';
    return null;
  }
  if (!l.conta || !contaPorId(db, l.conta)) return 'Escolha a conta.';
  const per = contaPorId(db, l.conta).perfil;
  if (l.tipo === 'saida_pj' && per !== 'PJ') return 'Saída da empresa precisa sair de uma conta da empresa.';
  if (l.tipo === 'saida_pf' && per !== 'PF') return 'Saída pessoal precisa sair de uma conta pessoal.';
  return null;
}
function criarLanc(db, l) {
  const erro = validarLanc(db, l);
  if (erro) return { ok: false, erro };
  const reg = { ...l, id: l.id || uid(), valor: r2(l.valor), criadoEm: l.criadoEm || Date.now() };
  if (reg.tipo === 'transf' && perfilLanc(db, reg) === perfilDest(db, reg)) delete reg.natureza;
  db.lanc.push(reg);
  return { ok: true, lanc: reg };
}

/* ---------- cálculo mensal (empresa) ---------- */
function calcularLista(db, ls, ym) {
  const aliq = (db.config.aliquota || 0) / 100;
  const cm = mapaCats(db);
  let fat = 0, variaveis = 0, fixosPagos = 0, dasPago = 0, prolabore = 0, pf = 0, rendaPF = 0, distribuicao = 0, retirado = 0, aportes = 0, cruzadas = 0, saidasPJ = 0, rendaPFTransf = 0;
  for (const l of ls) {
    const v = cent(l.valor);
    if (l.tipo === 'entrada') { if (perfilLanc(db, l) === 'PJ') fat += v; else rendaPF += v; }
    else if (l.tipo === 'saida_pf') pf += v;
    else if (l.tipo === 'saida_pj') {
      saidasPJ += v;
      const t = (cm[l.cat] || {}).tipo;
      if (t === 'imposto') dasPago += v;
      else if (t === 'pj_fixo' || l.fixoId) fixosPagos += v;
      else variaveis += v;
    } else if (l.tipo === 'transf') {
      const o = perfilLanc(db, l), d = perfilDest(db, l);
      if (o && d && o !== d) {
        cruzadas += v;
        if (o === 'PJ') {
          retirado += v;
          if (l.natureza === 'prolabore') prolabore += v;
          else if (l.natureza === 'distribuicao') distribuicao += v;
          if (NATUREZA_RENDA_PF.includes(l.natureza)) rendaPFTransf += v;
        } else aportes += v;
      }
    }
  }
  fat /= 100; variaveis /= 100; fixosPagos /= 100; dasPago /= 100; prolabore /= 100; pf /= 100; rendaPF /= 100; distribuicao /= 100; retirado /= 100; aportes /= 100; cruzadas /= 100; saidasPJ /= 100; rendaPFTransf /= 100;

function classificarV2(texto, db, esc) {
  const r = classificar(texto, db.cats), t = norm(texto);
  let tipo = r.tipo, cat = r.cat, natureza = '', conta = '', contaDest = '';
  if (/distribuicao de lucro|dividendo|retirada de lucro/.test(t)) { tipo = 'prolabore'; natureza = 'distribuicao'; }
  else if (tipo === 'prolabore') natureza = 'prolabore';
  if (tipo === 'saida_pf' && /\b(recebi|ganhei)\b/.test(t)) { tipo = 'entrada'; }
  if (tipo === 'prolabore') {
    tipo = 'transf'; cat = '';
    const o = contaPadrao(db, 'PJ'), d = contaPadrao(db, 'PF');
    conta = o ? o.id : ''; contaDest = d ? d.id : '';
  } else {
    if (esc === 'pf' && tipo === 'saida_pj') { tipo = 'saida_pf'; cat = ''; }

function relatorioTexto(ym) {

    'Ponto de equilíbrio: ' + (isNaN(c.pe) ? '—' : brl(c.pe)), 'Gastos pessoais (PF): ' + brl(c.pf)].join('\n');
}
function graficoEvolucao(meses) {
  const W = 360, H = 190, top = 18, bot = 26, hh = H - top - bot, n = meses.length, slot = W / n, bw = slot * .32;
  const max = Math.max(1, ...meses.map(m => m.c.fat)), min = Math.min(0, ...meses.map(m => m.c.sobra));
  const y = v => top + (max - v) / (max - min) * hh;
  const enxuto = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + 'k' : String(Math.round(v));
  let s = '<svg class="grafico" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Faturamento e sobra dos últimos meses"><line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="var(--line)" stroke-width="1.5"/>';
  meses.forEach((m, i) => {
    const cx = slot * i + slot / 2, x1 = cx - bw - 1, x2 = cx + 1;
    const yf = y(m.c.fat), ys = y(m.c.sobra), y0 = y(0);
    s += '<rect x="' + x1 + '" y="' + Math.min(yf, y0) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(y0 - yf)) + '" rx="3" fill="var(--accent)"/>';
    s += '<rect x="' + x2 + '" y="' + Math.min(ys, y0) + '" width="' + bw + '" height="' + Math.max(1, Math.abs(y0 - ys)) + '" rx="3" fill="' + (m.c.sobra >= 0 ? 'var(--s-sobra)' : 'var(--s-imp)') + '"/>';
    if (m.c.fat > 0) s += '<text x="' + (x1 + bw / 2) + '" y="' + (yf - 4) + '" text-anchor="middle">' + enxuto(m.c.fat) + '</text>';
    if (m.c.sobra !== 0) s += '<text x="' + (x2 + bw / 2) + '" y="' + (m.c.sobra >= 0 ? ys - 4 : ys + 11) + '" text-anchor="middle">' + enxuto(m.c.sobra) + '</text>';
    s += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" style="font-weight:700">' + nomeMesCurto(m.ym) + '</text>';
  });
  return s + '</svg><div class="legh"><span><i style="background:var(--accent)"></i>Faturamento</span><span><i style="background:var(--s-sobra)"></i>Sobra</span></div>';
}

/* ---------- arquivos ---------- */
async function baixar(nome, texto, mime) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({ filename: nome, data: texto }); toast('Arquivo enviado para download'); return true; }
    }
  } catch (e) { if (e && e.code === 'declined') return false; }
  try {
    const blob = new Blob([texto], { type: mime || 'text/plain' }); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Arquivo baixado'); return true;
  } catch (e) { toast('Não foi possível baixar aqui. Use “Copiar”.'); return false; }
}
async function copiar(txt, ok) {
  try { await navigator.clipboard.writeText(txt); toast(ok || 'Copiado'); return true; } catch (e) { /* tenta o método antigo */ }
  try {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    const r = document.execCommand('copy'); ta.remove(); if (r) { toast(ok || 'Copiado'); return true; }
  } catch (e) { /* segue */ }
  toast('Não foi possível copiar neste ambiente.'); return false;
}
function backupJSON() { return JSON.stringify({ app: 'rua-finance', versao: 2, exportadoEm: new Date().toISOString(), dados: db }, null, 1); }
function restaurar(texto) {
  let o; try { o = JSON.parse(texto); } catch (e) { toast('Arquivo inválido: não é um backup do app.'); return; }
  const d = o && (o.app === 'gfk-controle' || o.app === 'rua-finance') ? o.dados : (o && Array.isArray(o.lanc) ? o : null);
  if (!d || !Array.isArray(d.lanc)) { toast('Arquivo inválido: não é um backup do app.'); return; }
  confirmar('Restaurar backup?', 'Os dados atuais (' + db.lanc.length + ' lançamentos) serão substituídos por ' + d.lanc.length + ' lançamentos do backup.', 'Restaurar').then(sim => {
    if (!sim) return;
    db = migrarDb(d); salvar(); aplicarTema(); render(); toast('Backup restaurado');
  });
}
function aplicarTema() { const t = db.config.tema; if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }

function graficoPrevisao(p, p2) {
  const W = 360, H = 170, L = 8, R = 8, T = 14, B = 24, n = p.pontos.length;
  const vals = p.pontos.map(x => x.saldo).concat(p2 ? p2.map(x => x.saldo) : [0]);
  let mx = Math.max(...vals, 0), mn = Math.min(...vals, 0); if (mx === mn) { mx += 1; mn -= 1; }
  const X = i => L + (n <= 1 ? 0 : i / (n - 1) * (W - L - R)), Y = v => T + (mx - v) / (mx - mn) * (H - T - B);
  const path = arr => arr.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.saldo).toFixed(1)).join(' ');
  const mi = p.pontos.findIndex(x => x.data === p.minimo.data);
  let s = '<svg class="grafico" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Saldo projetado">';
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>';
  if (p2) s += '<path d="' + path(p2) + '" fill="none" stroke="var(--s-fix)" stroke-width="2" stroke-dasharray="5 4"/>';
  s += '<path d="' + path(p.pontos) + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  s += '<circle cx="' + X(mi) + '" cy="' + Y(p.minimo.saldo) + '" r="4.5" fill="' + (p.minimo.saldo < 0 ? 'var(--neg)' : 'var(--accent)') + '"/>';
  s += '<text x="' + L + '" y="' + (H - 6) + '">' + fmtData(p.pontos[0].data) + '</text><text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + fmtData(p.pontos[n - 1].data) + '</text>';
  return s + '</svg>';
}

function render() {
  const mapa = { inicio: vInicio, caixa: vCaixa, lancar: vLancar, agenda: vAgenda, analises: vAnalises, indic: vAnalises, mais: vMais, cadastros: vCadastros, relatorios: vRelatorios, ajustes: vAjustes, contas: vContas };
  $('#main').innerHTML = (mapa[ui.view] || vInicio)();
  document.querySelectorAll('.nav button').forEach(b => { if (b.dataset.ir === ABAS[ui.view]) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  ajustarTextos();
  if (ui.view === 'lancar') { montarForm(); if (ui.autoMic) { ui.autoMic = false; iniciarVoz(); } }

/* ---------- voz / frase ---------- */
function aplicarFrase(texto, viaVoz) {
  const r = classificarV2(texto, db, escopo());
  const base = ui.form && !ui.form.id ? ui.form : novoForm();
  const comp = { tipo: r.tipo, cat: r.cat, data: r.data, desc: r.desc, conta: r.conta, contaDest: r.contaDest, natureza: r.natureza || 'prolabore' };
  if (!r.valor) {
    ui.form = { ...base, ...comp }; preencherForm();
    setVoz('Entendi “' + r.desc + '”, mas não achei o valor. Digite o valor abaixo.', 'err');
    const v = $('#fValor'); if (v) v.focus(); return;
  }
  if (viaVoz && db.config.voiceAuto) {
    const cand = { tipo: r.tipo, valor: r.valor, data: r.data, desc: r.desc, cat: r.cat, conta: r.conta, ...(r.tipo === 'transf' ? { contaDest: r.contaDest, natureza: r.natureza } : {}) };
    const x = criarLanc(db, cand);
    if (x.ok) {
      logar('Lançamento por voz', TIPOS[r.tipo].curto + ' ' + brl(r.valor)); salvar(); atualizarRecentes();
      setVoz('Salvo: ' + TIPOS[r.tipo].curto + ' de ' + brl(r.valor), 'ok');
      toast('Salvo: ' + TIPOS[r.tipo].curto + ' ' + brl(r.valor), () => { db.lanc = db.lanc.filter(y => y.id !== x.lanc.id); salvar(); atualizarRecentes(); }); return;
    }
  }
  ui.form = { id: null, valor: numParaInput(r.valor), ...comp }; ui.catManual = !!r.cat; preencherForm();
  const cat = catDe(r.cat);
  setVoz('Entendi: ' + TIPOS[r.tipo].curto + ' de ' + brl(r.valor) + (cat ? ' em ' + cat.nome : '') + '. Confira e toque em Salvar.', 'ok');
}

/* ---------- exemplo (dados fictícios, claramente identificados) ---------- */
function carregarExemplo() {
  const p = novoDb(); p.exemplo = true; p.config.perfil = db.config.perfil; p.config.tema = db.config.tema;
  let s = 20261103;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const hoje = hojeISO(), atual = hoje.slice(0, 7);
  p.contas[0].saldoIni = 3500; p.contas[1].saldoIni = 800; p.contas[0].nome = 'Conta PJ'; p.contas[1].nome = 'Conta pessoal'; p.contas[1].tipo = 'corrente';
  p.contas.push({ id: 'rv_pf', nome: 'Reserva de emergência', perfil: 'PF', tipo: 'reserva', saldoIni: 6000, ativa: true, criadoEm: hoje });
  p.contas.forEach(c => { c.confirmadoEm = hoje; });
  const fixos = [['Contador', 250, 10, 'f_contador'], ['Seguro da moto', 180, 15, 'f_seguro'], ['Parcela da moto', 890, 5, 'f_parcela'], ['Internet e telefone', 120, 20, 'f_internet']];
  p.fixos = fixos.map((f, i) => ({ id: 'fx' + i, nome: f[0], valor: f[1], dia: f[2], cat: f[3], criado: somaMes(atual, -3) }));
  for (let k = -3; k <= 0; k++) {
    const ym = somaMes(atual, k), ultimo = k === 0 ? Number(hoje.slice(8)) : 28;
    const dia = () => ym + '-' + pad(1 + Math.floor(rnd() * Math.max(1, ultimo - 1)));
    const add = (tipo, valor, data, desc, cat, extra) => { if (data > hoje) return; p.lanc.push({ id: uid() + Math.floor(rnd() * 1e6), tipo, valor: r2(valor), data, desc, cat: cat || '', conta: tipo === 'saida_pf' ? 'c_pf' : 'c_pj', ...(extra || {}) }); };
    for (let i = 0; i < 20; i++) add('entrada', 90 + rnd() * 170, dia(), 'Frete', 'r_frete');
    add('entrada', 1400 + rnd() * 500, ym + '-' + pad(Math.min(ultimo, 12)), 'Briggs', 'r_briggs');
    for (let i = 0; i < 8; i++) add('saida_pj', 45 + rnd() * 40, dia(), 'Gasolina', 'v_comb');
    add('saida_pj', 120 + rnd() * 160, dia(), 'Mecânico', 'v_manut');
    for (let i = 0; i < 6; i++) add('saida_pj', 18 + rnd() * 14, dia(), 'Almoço', 'v_alim');
    p.fixos.forEach(f => add('saida_pj', f.valor, ym + '-' + pad(f.dia), f.nome, f.cat, { fixoId: f.id }));
    add('transf', 2200, ym + '-' + pad(6), 'Pró-labore', '', { conta: 'c_pj', contaDest: 'c_pf', natureza: 'prolabore' });
    if (k === -1) add('transf', 800, ym + '-' + pad(20), 'Distribuição de lucros', '', { conta: 'c_pj', contaDest: 'c_pf', natureza: 'distribuicao' });
    for (let i = 0; i < 4; i++) add('saida_pf', 60 + rnd() * 100, dia(), 'Mercado', 'p_mercado');
    add('saida_pf', 80 + rnd() * 90, dia(), 'Lazer', 'p_lazer');
    add('saida_pf', 900, ym + '-' + pad(10), 'Aluguel', 'p_moradia');
    add('saida_pf', 110, ym + '-' + pad(20), 'Internet de casa', 'f_internet'.replace('f_internet', 'p_moradia'));
  }
  const prox = dia => { let d = dataNoMes(atual, dia); if (d < hoje) d = dataNoMes(somaMes(atual, 1), dia); return d; };
  p.recorr.push({ id: 'rc1', desc: 'Aluguel', valor: 900, tipo: 'pagar', perfil: 'PF', cat: 'p_moradia', freq: 'mensal', dia: 10, inicio: prox(10), fim: '', parcelas: 0, ativa: true });
  p.recorr.push({ id: 'rc2', desc: 'Internet de casa', valor: 110, tipo: 'pagar', perfil: 'PF', cat: 'p_moradia', freq: 'mensal', dia: 20, inicio: prox(20), fim: '', parcelas: 0, ativa: true });
  const ag = (tipo, perfil, desc, valor, dias, cat) => p.agenda.push({ id: uid() + Math.floor(rnd() * 1e6), tipo, perfil, desc, valor, venc: addDias(hoje, dias), cat: cat || '', status: 'aberto', criadoEm: hoje });
  ag('pagar', 'PF', 'Seguro do carro', 380, 4); ag('receber', 'PJ', 'Transportes Silva', 1200, 6, 'r_frete'); ag('pagar', 'PJ', 'Pneus (fornecedor)', 640, 9, 'v_manut');
  materializar(p, hoje, 90);
  p.log.push({ ts: Date.now(), acao: 'Exemplo', detalhe: 'Dados fictícios carregados para demonstração.' });
  db = p; salvar(); aplicarTema(); ui.form = novoForm(); render(); toast('Dados de exemplo carregados');
}

/* ---------- exportação ---------- */
function csvMes(ym) {
  const q = s => { s = String(s == null ? '' : s); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const linhas = ['Data;Tipo;Categoria ou natureza;Conta;Descrição;Valor'];
  db.lanc.filter(l => l.data.slice(0, 7) === ym).sort((a, b) => a.data.localeCompare(b.data)).forEach(l => {
    const [y, m, d] = l.data.split('-');
    const conta = l.tipo === 'transf' ? contaNome(l.conta) + ' → ' + contaNome(l.contaDest) : contaNome(contaDoLanc(db, l));
    const cat = l.tipo === 'transf' ? (NATUREZAS[l.natureza] || 'Entre contas próprias') : (catDe(l.cat) || {}).nome || '';
    linhas.push([d + '/' + m + '/' + y, TIPOS[l.tipo].curto, cat, conta, l.desc || '', (l.tipo === 'entrada' || l.tipo === 'transf' ? '' : '-') + l.valor.toFixed(2).replace('.', ',')].map(q).join(';'));
  });
  return '\ufeff' + linhas.join('\r\n');
}

  },
  salvarLanc: () => {
    const f = ui.form, v = r2(parseBR(f.valor));
    const tr = f.tipo === 'transf';
    let cat = tr ? '' : f.cat;
    if (!cat && f.desc && !tr) { const c = catSugerida(f.desc, f.tipo, db.cats); if (c) cat = c.id; }
    const base = { tipo: f.tipo, valor: v, data: f.data, desc: (f.desc || '').trim(), cat, conta: f.conta };
    if (tr) { base.contaDest = f.contaDest; base.natureza = f.natureza; }
    const falha = er => { erroForm(er); const alvo = /valor/i.test(er) ? '#fValor' : /data/i.test(er) ? '#fData' : null; if (alvo && $(alvo)) $(alvo).focus(); };
    if (f.id) {
      const i = db.lanc.findIndex(x => x.id === f.id); if (i < 0) { falha('Lançamento não encontrado.'); return; }
      const cand = { ...db.lanc[i], ...base }; if (!tr) { delete cand.contaDest; delete cand.natureza; }
      const er = validarLanc(db, cand); if (er) { falha(er); return; }
      db.lanc[i] = { ...cand, valor: r2(cand.valor), editadoEm: Date.now() }; logar('Lançamento editado', TIPOS[cand.tipo].curto + ' ' + brl(v)); salvar();
      ui.form = novoForm(); toast('Alterações salvas'); ir('caixa'); return;
    }
    const r = criarLanc(db, base); if (!r.ok) { falha(r.erro); return; }
    erroForm(''); logar('Lançamento criado', TIPOS[r.lanc.tipo].curto + ' ' + brl(v) + (r.lanc.desc ? ' · ' + r.lanc.desc : '')); salvar();
    ui.form = novoForm(f.tipo); ui.catManual = false; montarForm(); setVoz('Salvo! Pode lançar o próximo.', 'ok'); const fr = $('#frase'); if (fr) fr.value = '';
    toast('Salvo: ' + TIPOS[r.lanc.tipo].curto + ' ' + brl(v), () => { db.lanc = db.lanc.filter(x => x.id !== r.lanc.id); logar('Lançamento desfeito', ''); salvar(); atualizarRecentes(); });
  },
  lancEditar: b => {
    const l = db.lanc.find(x => x.id === b.dataset.id); if (!l) return; fecharSheet();
    ui.form = { id: l.id, tipo: l.tipo, valor: numParaInput(l.valor), desc: l.desc || '', cat: l.cat || '', data: l.data, conta: contaDoLanc(db, l) || '', contaDest: l.contaDest || '', natureza: l.natureza || 'prolabore' };
    ui.catManual = true; ir('lancar');
  },
  lancExcluir: async b => {
    const id = b.dataset.id, l = db.lanc.find(x => x.id === id); if (!l) return;
    const ag = db.agenda.find(a => a.lancId === id);
    const sim = await confirmar('Excluir lançamento?', TIPOS[l.tipo].curto + ' de ' + brl(l.valor) + ' em ' + fmtData(l.data) + '.' + (ag ? ' A conta “' + ag.desc + '” voltará para a agenda como em aberto.' : '') + ' Você poderá desfazer logo em seguida.');
    if (!sim) return;
    db.lanc = db.lanc.filter(x => x.id !== id); let reab = null;
    if (ag) { reab = { status: ag.status, pagoEm: ag.pagoEm, lancId: ag.lancId }; ag.status = 'aberto'; delete ag.lancId; delete ag.pagoEm; }
    logar('Lançamento excluído', TIPOS[l.tipo].curto + ' ' + brl(l.valor)); salvar(); render();
    toast('Lançamento excluído', () => { db.lanc.push(l); if (ag && reab) Object.assign(ag, reab); logar('Exclusão desfeita', ''); salvar(); render(); });
  },
  lanc: b => {
    const l = db.lanc.find(x => x.id === b.dataset.id); if (!l) return; const cat = catDe(l.cat);
    const tom = l.tipo === 'entrada' ? 'pos' : l.tipo === 'transf' ? 'mut' : 'neg';
    const det = l.tipo === 'transf' ? esc(contaNome(l.conta)) + ' → ' + esc(contaNome(l.contaDest)) + (l.natureza ? ' · ' + esc(NATUREZAS[l.natureza]) : ' · entre contas próprias') : esc(contaNome(contaDoLanc(db, l))) + (cat ? ' · ' + esc(cat.nome) : '');
    abrirSheet('<h2 style="margin-bottom:2px">' + esc(l.desc || (cat && cat.nome) || TIPOS[l.tipo].curto) + '</h2><div class="sm">' + rotuloDia(l.data) + ' · ' + TIPOS[l.tipo].nome + '</div><div class="sm">' + det + '</div><div class="gv ' + tom + '">' + brl(l.valor) + '</div>' +
      '<div class="btns"><button class="btn danger" data-act="lancExcluir" data-id="' + esc(l.id) + '">Excluir</button><button class="btn pri" data-act="lancEditar" data-id="' + esc(l.id) + '">Editar</button></div>');
  },
  catSalvar: b => {
    const nome = $('#cNome').value.trim(); if (!nome) { $('#cErro').textContent = 'Dê um nome à categoria.'; return; }
    const tipo = $('#cTipo').value, palavras = $('#cPal').value.split(',').map(s => s.trim()).filter(Boolean), essencial = $('#cEss').checked, id = b.dataset.id;
    if (id) { const c = catDe(id); Object.assign(c, { nome, tipo, palavras, essencial }); } else db.cats.push({ id: 'c_' + uid(), nome, tipo, palavras, essencial });
    logar('Categoria salva', nome); salvar(); fecharSheet(); render(); toast('Categoria salva');
  },
  saudePadrao: () => { db.config.saude = { ...SAUDE_PADRAO }; logar('Critérios de saúde restaurados', ''); salvar(); render(); toast('Critérios restaurados'); },
  verLog: () => {
    const ls = db.log.slice(-60).reverse();
    abrirSheet('<h2>Histórico de alterações</h2>' + (ls.length ? '<div class="lista">' + ls.map(x => '<div class="row" style="cursor:default"><span class="rm"><b style="white-space:normal">' + esc(x.acao) + '</b><small style="white-space:normal">' + new Date(x.ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) + (x.detalhe ? ' · ' + esc(x.detalhe) : '') + '</small></span></div>').join('') + '</div>' : '<p class="sm">Nada registrado ainda.</p>') + '<div class="btns um"><button class="btn sec" data-act="fechar">Fechar</button></div>');
  },
  sairExemplo: async () => {
    const sim = await confirmar('Sair do exemplo?', 'Os dados fictícios serão apagados e o app volta ao começo.', 'Sair do exemplo'); if (!sim) return;
    const perfil = db.config.perfil, tema = db.config.tema; db = novoDb(); db.config.perfil = perfil; db.config.tema = tema; salvar(); ui.form = novoForm(); ir('inicio'); toast('Exemplo removido');
  },
  apagarTudo: async () => {
    const sim = await confirmar('Apagar todos os dados?', 'Serão removidos ' + db.lanc.length + ' lançamentos, contas, agenda, categorias e metas. Faça um backup antes se precisar.', 'Apagar tudo');
    if (!sim) return; db = novoDb(); salvar(); aplicarTema(); ui.form = novoForm(); ir('inicio'); toast('Dados apagados');
  }
});

/* ---------- campos que reagem a mudanças ---------- */
document.addEventListener('change', e => {
  const id = e.target.id, f = ui.form;
  if (id === 'fConta') { f.conta = e.target.value; }
  else if (id === 'fOrig') { f.conta = e.target.value; atualizarTipoUI(); }
  else if (id === 'fDest') { f.contaDest = e.target.value; atualizarTipoUI(); }
  else if (id === 'fNat') { f.natureza = e.target.value; atualizarTipoUI(); }
  else if (id === 'gPerfil') { $('#gCat').innerHTML = catsAgenda($('#gTipo').value, e.target.value, ''); }
  else if (id === 'gRep') { const pb = $('#gParcBox'); if (pb) pb.hidden = e.target.value !== 'parcelado'; }
  else if (id === 'cfgPL') { const v = parseBR(e.target.value); db.config.prolaborePlanejado = isNaN(v) || v < 0 ? 0 : r2(v); salvar(); toast('Planejamento salvo'); }
  else if (['cfgResPF', 'cfgResPJ', 'cfgCompS', 'cfgCompA', 'cfgCompR', 'cfgMarg'].includes(id)) {
    const mapa = { cfgResPF: 'reservaMesesPF', cfgResPJ: 'reservaMesesPJ', cfgCompS: 'compSaudavel', cfgCompA: 'compAtencao', cfgCompR: 'compRisco', cfgMarg: 'margemSaudavel' };
    const v = parseBR(e.target.value), novo = { ...SAUDE_PADRAO, ...(db.config.saude || {}) };
    if (isNaN(v) || v < 0 || v > 1200) { toast('Informe um número válido.'); e.target.value = numParaInput(novo[mapa[id]]); return; }
    novo[mapa[id]] = v;
    if (!(novo.compSaudavel < novo.compAtencao && novo.compAtencao < novo.compRisco)) { toast('Os limites devem crescer: saudável < atenção < risco.'); e.target.value = numParaInput((db.config.saude || SAUDE_PADRAO)[mapa[id]]); return; }
    db.config.saude = novo; logar('Critérios de saúde alterados', id); salvar(); toast('Critério salvo');
  }
});

/* ---------- início ---------- */
aplicarTema();
try { history.replaceState({ v: 'inicio' }, ''); } catch (e) { /* ok */ }
if (materializar(db, hojeISO(), 90) | (window.__migrou ? 1 : 0)) salvar();
render();

(function () { const sp = document.getElementById('splash'); if (!sp) return; setTimeout(() => { sp.classList.add('saindo'); setTimeout(() => sp.remove(), 450); }, 1200); })();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
</body>
</html>
